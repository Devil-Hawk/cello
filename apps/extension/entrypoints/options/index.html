<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Cello options</title>
    <link rel="stylesheet" href="../popup/style.css" />
    <style>
      body { width: auto; max-width: 520px; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input, select { width: 100%; min-height: 44px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--ink3); background: var(--raised); color: var(--ink); font: inherit; }
      h2 { font-size: 15px; margin: 24px 0 4px; }
      input:focus-visible, select:focus-visible { outline: 2px solid var(--petrol-text); outline-offset: 2px; }
      .row { margin-top: 16px; }
      #status { margin-top: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cello</h1>
      <p>The address Cello runs at and the token that lets this browser fill your applications.</p>
      <label for="origin">Cello address</label>
      <input id="origin" type="url" autocomplete="off" spellcheck="false" />
      <label for="token">Token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" />
      <h2>This computer</h2>
      <p>Lets Cello use a model running on this computer (Ollama or LM Studio) for work you have set to run here. Leave empty to turn it off.</p>
      <label for="relay-token">Relay token</label>
      <input id="relay-token" type="password" autocomplete="off" spellcheck="false" />
      <label for="runtime">Runs on</label>
      <select id="runtime"><option value="ollama">Ollama</option><option value="lmstudio">LM Studio</option></select>
      <label for="model">Model name</label>
      <input id="model" type="text" autocomplete="off" spellcheck="false" placeholder="llama3.1:8b" />
      <div class="row"><button id="save" class="primary" type="button">Save</button></div>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
