<!DOCTYPE html><html id="facebook" class="_9dls _9t1d" lang="en" dir="ltr"><head><link data-default-icon="https://static.xx.fbcdn.net/rsrc.php/y3/r/iUyd7C5uqWN.webp" rel="shortcut icon" href="https://static.xx.fbcdn.net/rsrc.php/y3/r/iUyd7C5uqWN.webp" /><meta name="bingbot" content="noarchive" /><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=2,shrink-to-fit=no" /><meta name="title" content="ASIC Validation Engineer, Network Validation &amp; Characterization" /><meta property="og:title" content="ASIC Validation Engineer, Network Validation &amp; Characterization" /><meta name="description" content="Meta&#039;s Infra Silicon is to deliver scalable and reliable custom ASIC solutions to meet Meta data center needs. Ramping to production and solving data ce..." /><meta property="og:description" content="Meta&#039;s Infra Silicon is to deliver scalable and reliable custom ASIC solutions to meet Meta data center needs. Ramping to production and solving data ce..." /><meta property="og:image" content="https://lookaside.fbsbx.com/elementpath/media/?media_id=1002056384941451&amp;version=1790262796" /><link rel="canonical" href="https://www.metacareers.com/profile/job_details/1616812923224613/" /><script type="application/ld+json" nonce="JbBqGKzf">{"\u0040context":"https:\/\/schema.org","\u0040type":"JobPosting","title":"ASIC Validation Engineer, Network Validation & Characterization","description":"Meta's Infra Silicon is to deliver scalable and reliable custom ASIC solutions to meet Meta data center needs. Ramping to production and solving data center scaling and deployment challenges requires a systems-based approach to silicon bring-up and validation.\n\nThe team works on all aspects of silicon productization: early architecture and design inputs, pre-silicon validation on emulation platforms, first-silicon bring-up, and post-silicon characterization across process, voltage, and temperature corners. We write tests, build bare-metal environments and reusable frameworks that scale from pre-silicon platforms to large fleets of ASICs in the lab, and we build and maintain extensive lab automation to do it at volume and velocity.","responsibilities":"Execute validation and PVT characterization test plans on emulation platforms and on silicon in the lab&nbsp;Bring up boards and systems and set up test environments and instrumentation&nbsp;Validate your domain's feature sets and report results against expected behavior&nbsp;Run and interpret domain measurements&nbsp;Write and maintain Python test scripts, automation, and analysis tooling; contribute to the team's shared validation framework&nbsp;Triage and debug failures hands-on \u2014 narrow down whether an issue is silicon, firmware, driver, board, or test setup \u2014 and document findings clearly&nbsp;Use schematics and platform documentation to probe the right signals or nets and interpret results correctly&nbsp;Produce clean, reproducible characterization data and summaries for design, firmware, and manufacturing partners&nbsp;Support lab infrastructure: bench, rack, and power setup; instrument calibration; switch and traffic-generator configuration; and keeping test environments running","hiringOrganization":{"\u0040type":"Organization","name":"Meta","sameAs":"https:\/\/www.meta.com\/","logo":"https:\/\/static.xx.fbcdn.net\/rsrc.php\/y3\/r\/7ngPh_7s-rQ.webp"},"datePosted":"2026-10-02T09:46:48-07:00","jobLocation":[{"\u0040type":"Place","name":"Sunnyvale, CA","address":{"\u0040type":"PostalAddress","addressLocality":"Sunnyvale","addressRegion":"California","addressCountry":"US"}}],"qualifications":"Currently has, or is in the process of obtaining a Bachelor's degree in Computer Science, Computer Engineering, relevant technical field, or equivalent practical experience. Degree must be completed prior to joining Meta&nbsp;2+ years of relevant industry experience in ASIC validation, hardware bring-up, or a related silicon engineering discipline&nbsp;Hands-on lab experience with hardware bring-up, debug, and measurement&nbsp;Experience with test and measurement instrumentation in a lab environment&nbsp;Ability to read schematics and platform documentation&nbsp;Proficiency in Python for test development and automation&nbsp;Experience with pre-silicon (emulation\/FPGA) or post-silicon validation Experience with both pre- and post-silicon validation&nbsp;Familiarity with firmware\/BMC interfaces and telemetry collection&nbsp;MS in Electrical Engineering, Computer Engineering, Computer Science, or a related field&nbsp;Domain depth with front-end and\/or back-end NICs; RDMA (RoCE and\/or InfiniBand); Linux networking internals and NIC drivers&nbsp;Exposure to PVT (Process \/ Voltage \/ Temperature) characterization&nbsp;Experience with custom silicon or data center hardware","employmentType":"FULL_TIME","directApply":true,"identifier":{"\u0040type":"PropertyValue","name":"Meta","value":"a1KiE00000028vxUAA"}}</script>
