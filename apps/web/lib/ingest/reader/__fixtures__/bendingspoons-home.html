<html><head><title>Open positions | Bending Spoons</title></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"list": [{"id": "63c548b3521886004f3daec0", "jobTitle": "Product manager", "isEvent": false, "status": "active", "highLevelDescription": "<span>At Bending Spoons, we\u2019re striving to build one of the all-time great companies. A company that serves a huge number of customers. A company where team members grow to their full potential. A company that functions at unparalleled levels of effectiveness and efficiency. A company that creates value for shareowners at an extraordinary rate. And a company that does so while adhering to high ethical standards.<br></span><span><br></span><span>In pursuit of this objective, we acquire and improve digital businesses, not to sell on, but to own and operate for the long term. The transformations we make are often deep\u2014designed to speed up innovation, benefit customers, and strengthen business performance. Here, hierarchy is minimal and teams are small and talent-dense. We operate established products with the ambition, agility, and urgency of a startup. Across the company, we integrate AI deeply into how we work so that human judgment and machine intelligence reinforce each other.<br></span><span><br></span><span>For a talented, driven, and collaborative individual, working at Bending Spoons is an opportunity to learn, make an impact, and progress their career at an exceptionally high rate. That\u2019s our promise to such a candidate.</span>", "responsibilities": ["<span><strong>Investigate. </strong>Build a deep understanding of your product, its business model, and the drivers behind its growth. Use AI, data, and user research to quickly uncover meaningful opportunities and challenge assumptions.</span>", "<span><strong>Innovate. </strong>Combine user insights, market signals, and emerging technologies to identify high-impact initiatives and features. Use modern tools, first-principles reasoning, and your creative insights to explore solution spaces quickly and sharpen product thinking.</span>", "<span><strong>Execute. </strong>Turn ideas into impactful features. Prioritize ruthlessly, using data to focus on what truly moves the needle. Own the development process end-to-end, coordinating designers, engineers, and other teammates to build solutions that address users\u2019 most important needs.</span>", "<span><strong>Iterate. </strong>Use experimentation and product metrics to understand what works and what doesn\u2019t. Treat every project as a learning loop, using insights from past work to improve the product continuously.</span>"], "requirements": [{"title": "Reasoning ability", "description": "Given the necessary knowledge, you can solve complex problems. You think from first principles, and structure your ideas sharply. You resist the influence of biases. You identify and take care of the details that matter."}, {"title": "Drive", "description": "You\u2019re extremely ambitious in everything you do\u2014and your initiative, effort, and tenacity match the intensity of your ambition. You feel deeply responsible for your work. You hold yourself to a high\u2014and rising\u2014bar."}, {"title": "Team spirit", "description": "You give generously and without the expectation of receiving in return. You support the best idea, not your idea. You're always happy to get your hands dirty to help your team. You\u2019re reliable, honest, and transparent."}, {"title": "Proficiency in English", "description": "You read, write, and speak proficiently in English."}], "officeLocations": [{"title": "Milan (Italy)", "country": {"isoCode": "IT", "name": "Italy", "phoneCode": "+39", "enablesRemoteWork": true, "euMember": true, "eligibleForVisaSponsorship": true}}, {"title": "London (UK)", "country": {"isoCode": "GB", "name": "United Kingdom", "phoneCode": "+44", "enablesRemoteWork": true, "euMember": false, "eligibleForVisaSponsorsh nd accounts payable journals, ensuring accurate monthly controls. Perform bank reconciliations and manage outgoing payments.</span>", "<span><strong>Take an active role in month-end closures and ERP management. </strong>Maintain detailed records of revenues, costs, and cash flow. Oversee ERP processes to support the preparation of financial statements for both individual and consolidated entities.</span>", "<span><strong>Support the M&amp;A accounting processes integration. </strong>Manage bookkeeping for newly acquired companies, support in the design of new processes, and assist in their migration to our systems.</span>", "<span><strong>Prepare financial reports. </strong>Help produce accurate monthly financial reports to support strategic decision-making. Partner with our Technology team to prepare annual statements and implement accounting automations that enhance efficiency and reliability.</span>", "<span><strong>Provide audit support. </strong>Collaborate with the Finance team and coordinate with tax advisors, auditors, and consultants to ensure smooth preparation for both internal and external audits.</span>"], "requirements": [{"title": "Reasoning ability", "description": "Given the necessary knowledge, you can solve complex problems. You think from first principles, and structure your ideas sharply. You resist the influence of biases. You identify and take care of the details that matter."}, {"title": "Drive", "description": "You\u2019re extremely ambitious in everything you do\u2014and your initiative, effort, and tenacity match the intensity of your ambition. You feel deeply responsible for your work. You hold yourself to a high\u2014and rising\u2014bar."}, {"title": "Team spirit", "description": "You give generously and without the expectation of receiving in return. You support the best idea, not your idea. You're always happy to get your hands dirty to help your team. You\u2019re reliable, honest, and transparent."}, {"title": "Proficiency in English" eply into how we work so that human judgment and machine intelligence reinforce each other.<br></span><span><br></span><span>For a talented, driven, and collaborative individual, working at Bending Spoons is an opportunity to learn, make an impact, and progress their career at an exceptionally high rate. That\u2019s our promise to such a candidate.</span>", "responsibilities": ["<span><strong>Shape high-leverage product experiences. </strong>Design exceptional UI and UX\u2014from early concepts to polished delivery\u2014using the best available tools to explore more directions, move faster, and raise the quality bar. Ensure every experience is intuitive, effective, and delightful.</span>", "<span><strong>Start with an LLM.</strong> Use AI tools to clarify intent, draft short specs, and surface risks, edge cases, and initial approaches before opening any design tool. Use this work to align quickly with your team and compress the time from ambiguity to direction.</span>", "<span><strong>Prototype and build with AI.</strong> Use Cursor and Claude Code to turn rough concepts into interactive prototypes and generate production-ready frontend code. You know when to reach for code and when to reach for Figma\u2014and you move fluidly between both to get the best result.</span>", "<span><strong>Co-create with PMs and engineers from day one.</strong> Define UX requirements early, stay in the build through QA and release, and make engineering-aware design decisions.</span>", "<span><strong>Validate and measure.</strong> Talk directly with customers, run quick tests, and use what you learn to adjust direction. Track funnels, retention, and adoption to assess design effectiveness and sharpen what ships next.</span>", "<span><strong>Find the highest-leverage bets from the backlog.</strong> Identify where product improvements can unlock business value, align stakeholders around them, and move fast to deliver.</span>"], "requirements": [{"title": "Reasoning ability", "description"
