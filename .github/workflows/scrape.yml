name: Find new roles

# Reads the sites that only a browser can read. It has no schedule: the database
# clock (pg_cron, agent_sweep()) dispatches it with the companies that need it,
# at most 50 at a time, and only while the roles.render routine is on. A person's
# own check runs on the clock too (roles.check); this is its rendered tier.
# Run by hand from the Actions tab with a comma list of company ids.

on:
  workflow_dispatch:
    inputs:
      company_ids:
        description: 'Company ids to read, comma separated (at most 50)'
        required: true
        type: string

# One check at a time. Two overlapping ones would read the same companies twice
# (the database lock per company covers the in-app button and the autopilot).
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  find-new-roles:
    name: Find new roles
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 20 for the same reason ci.yml pins it: the Supabase client pulls in
          # undici, which needs the `File` global that Node 18 lacks.
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Python only fetches careers pages that need a browser (src/page.py).
      - name: Install page fetcher
        run: |
          cd packages/scrapers
          pip install -e ".[render,browser]"

      # Pages that build their job list with script need a browser (src/render.py,
      # src/browser_tier.py). It says who it is (Cello and the repository) and does
      # nothing to look like a person. Non-fatal: the fetcher degrades to the plain
      # request if a browser is missing, so an install hiccup must not stop the
      # check for every company.
      - name: Install browser
        continue-on-error: true
        run: |
          cd packages/scrapers
          playwright install --with-deps chromium

      - name: Find new roles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Free models only; each call is metered to the user whose company it is.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY || '' }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY || '' }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL || '' }}
          INGEST_PAGE_FETCHER: python
          # Via env, never interpolated into the script: a dispatch input is
          # attacker-shaped text. Must be a comma list of at most 50 UUIDs.
          COMPANY_IDS: ${{ github.event.inputs.company_ids || '' }}
        run: |
          uuid='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          if ! [[ "$COMPANY_IDS" =~ ^${uuid}(,${uuid}){0,49}$ ]]; then
            echo "::error::company_ids must be a comma list of 1 to 50 UUIDs"
            exit 1
          fi
          cd apps/web
          # npx, not `pnpm tsx`: tsx is not a declared dependency of this repo.
          npx tsx scripts/ingest.ts
