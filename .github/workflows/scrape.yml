name: Find new roles

on:
  schedule:
    # Every 6 hours at an odd minute (GitHub drops top-of-hour ticks; the
    # effective rate was already ~5 a day).
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      company_id:
        description: 'Specific company ID to check (optional)'
        required: false
        type: string

# One check at a time. Two overlapping ones would read the same companies twice
# (the database lock per company covers the in-app button and the autopilot).
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  find-new-roles:
    name: Find new roles
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 20 for the same reason ci.yml pins it: the Supabase client pulls in
          # undici, which needs the `File` global that Node 18 lacks.
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Python only fetches careers pages that need a browser (src/page.py).
      - name: Install page fetcher
        run: |
          cd packages/scrapers
          pip install -e ".[render,browser]"

      # Pages that build their job list with script return an empty shell to a
      # plain request; src/render.py escalates those to a real browser. Non-fatal:
      # the fetcher degrades to the plain request if a browser is missing, so an
      # install hiccup must not stop the check for every company.
      - name: Install Scrapling browser
        continue-on-error: true
        run: |
          cd packages/scrapers
          scrapling install

      # The click-through rung (src/browser_tier.py) drives Playwright directly,
      # so it needs its own Chromium. Usually a fast no-op after the step above.
      - name: Install click-through browser
        continue-on-error: true
        run: |
          cd packages/scrapers
          playwright install --with-deps chromium

      - name: Find new roles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Free models only; each call is metered to the user whose company it is.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY || '' }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY || '' }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL || '' }}
          INGEST_PAGE_FETCHER: python
          # Via env, never interpolated into the script: a dispatch input is
          # attacker-shaped text. Must be a UUID or empty.
          COMPANY_ID: ${{ github.event.inputs.company_id || '' }}
        run: |
          if [ -n "$COMPANY_ID" ] && ! [[ "$COMPANY_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::company_id must be a UUID"
            exit 1
          fi
          cd apps/web
          # npx, not `pnpm tsx`: tsx is not a declared dependency of this repo.
          npx tsx scripts/ingest.ts
