name: Harness Cron - Daily Digest

# Triggers the agentic harness cron endpoint, which creates + runs a daily
# digest agent_run for each active user. Guarded by the CRON_SECRET repo secret
# (must match the CRON_SECRET env var configured on the Vercel deployment).
#
# Does NOT touch scrape.yml. Uses one new repo secret (CRON_SECRET). The target
# URL defaults to prod but can be overridden with the HARNESS_CRON_URL repo
# variable (Settings -> Secrets and variables -> Actions -> Variables).

# No schedule here: a Vercel cron calls this route daily. This workflow stays
# as a manual trigger. curl waits up to 330s because the route's maxDuration
# is 300s.

on:
  workflow_dispatch:

jobs:
  digest:
    name: Daily digest runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger harness cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_URL: ${{ vars.HARNESS_CRON_URL || 'https://cello-two.vercel.app/api/harness/cron' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          echo "POST $CRON_URL"
          http_code=$(curl -sS -o /tmp/harness-cron.out -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 330)
          echo "HTTP $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Harness cron returned HTTP $http_code"
            exit 1
          fi
          # Public repo: never print the body. Whitelisted keys, numbers and
          # booleans only, so no user id, email or error text can reach the log.
          jq -c '{ok,activeUsers,processed,skippedForCapacity,traceSpansPruned} | with_entries(select(.value | type | IN("number", "boolean")))' /tmp/harness-cron.out 2>/dev/null || true
