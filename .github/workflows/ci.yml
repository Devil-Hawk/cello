name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'wp2/**', 'v2/**', 'chore/**', 'v3/**', 'v4/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 22: the extension's WXT 0.21 needs it, and every job runs the same Node so
  # a test never passes on one version and ships on another. (It was 20, not 18,
  # because undici reaches for the `File` global, which exists from Node 20.)
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '8'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

  test-web:
    name: Test Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

  test-extension:
    name: Test Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # The test build talks to the stub server on loopback, and waits 4 s, not 30 s,
      # for a confirmation that never comes.
      - name: Build the extension for the fixtures
        run: pnpm --filter @cello/extension build
        env:
          WXT_CELLO_ORIGIN: http://127.0.0.1:4599
          WXT_CELLO_CONFIRM_MS: '4000'

      - name: Install Chromium
        run: pnpm --filter @cello/extension exec playwright install --with-deps chromium

      - name: Run the fixtures
        run: pnpm --filter @cello/extension test:e2e

      - name: Upload the fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-report
          path: apps/extension/test-results/
          if-no-files-found: ignore

      # The package for the store and for loading by hand is built with the real origin.
      - name: Build the store package
        run: pnpm --filter @cello/extension zip

      - name: Upload the extension zip
        uses: actions/upload-artifact@v4
        with:
          name: cello-extension
          path: apps/extension/.output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true

  test-scrapers:
    name: Test Scrapers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd packages/scrapers
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          cd packages/scrapers
          ruff check src

      - name: Type check with mypy
        run: |
          cd packages/scrapers
          mypy src || true  # Allow type errors for now

      - name: Run tests
        run: |
          cd packages/scrapers
          pytest || true  # Allow test failures for now

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

  sql-checks:
    name: SQL checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run SQL checks and races
        run: bash supabase/checks/run.sh

      - name: A planted failing check fails the run
        run: |
          if bash supabase/checks/run.sh supabase/checks/fixtures/planted_failure.sql >planted.log 2>&1; then
            cat planted.log
            echo "run.sh passed a planted failing check"
            exit 1
          fi
          grep -q 'planted check' planted.log || { cat planted.log; exit 1; }
