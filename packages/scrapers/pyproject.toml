[project]
name = "cello-scrapers"
version = "0.1.0"
description = "Python scraping scripts for Cello job tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "supabase>=2.3.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "scrapling>=0.5,<0.6",
]

[project.optional-dependencies]
# Reading careers pages the way a browser does: Scrapling's HTTP, browser and stealth
# fetchers (the "fetchers" extra carries curl_cffi and the patchright browser driver)
# for src/page.py and src/worker.py. Playwright stays for src/browser_tier.py. The
# imports are lazy. After installing, `scrapling install` fetches the browser; run it
# on Actions or on your own machine, never in a default install.
render = [
    "scrapling[fetchers]>=0.5,<0.6",
    "playwright>=1.40",
]
# The last escalation rung, for boards that sit behind a click rather than
# just behind rendering (see src/browser_tier.py). Also optional and lazily
# imported for the same reason [render] is: this tier degrades to whatever
# the render tier produced wherever it is not provisioned. Playwright drives
# the deterministic click-through; browser-use's own LLM agent is the last,
# env-flag-gated rung. Install with `pip install -e ".[browser]" &&
# playwright install chromium`.
browser = [
    "browser-use[core]>=0.13.0",
    "playwright>=1.40.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# UP042 wants StrEnum, which requires Python 3.11+; local dev venv runs 3.10
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
