# Supabase configuration
# See: https://supabase.com/docs/guides/cli/config

[project]
id = "cello"
name = "Cello - Career Engine"

[api]
# Port to use for the API server
port = 54321
# Schemas to expose in your API
schemas = ["public"]
# Extra schemas to add to the search_path of every request
extra_search_path = ["extensions"]
# Max rows to return from the API
max_rows = 1000

[db]
# Port to use for the local database
port = 54322
# The database major version
major_version = 15

[studio]
# Port to use for Supabase Studio
port = 54323

[auth]
# Site URL for OAuth redirects
site_url = "http://localhost:3000"
# Additional redirect URLs
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# JWT expiry in seconds
jwt_expiry = 3600
# Enable email confirmations
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
